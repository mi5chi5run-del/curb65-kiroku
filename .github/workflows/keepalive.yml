name: keepalive
# Supabase無料枠の「7日無アクセスで一時停止→90日で削除」を防ぐ番犬。
# 毎日RESTにアクセスし、リポジトリ自体の休眠(60日で定期実行停止)も防ぐ。
# 2026-08-14 改訂：読み取りping1発だけでは Supabase 側に「活動なし」と判定され
#   一時停止予告メールが届いたため、①書き込み(upsert)を主手段にし ②1日2回へ増やした。
#   （問診用プロジェクトで同じ改訂を行い、書き込み型で HTTP 200 を実測ずみ）
#   書き込み先は専用テーブル keepalive（＝curb65_records は汚さない）。
#   keepalive テーブルが未作成の間は、従来どおり読み取りpingへフォールバックする。
# ※鍵は公開HTMLにも載っている publishable key。秘密鍵ではないので直書きのままでよい。
on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 06:00 JST（21:00 UTC）
    - cron: '0 9 * * *'    # 毎日 18:00 JST（09:00 UTC）
  workflow_dispatch: {}
permissions:
  contents: write
env:
  SB_URL: https://padogdidlrzfuysjzcsf.supabase.co
  SB_KEY: sb_publishable_LWQ4rBSGPWViDk0pXeY_Mg_ooaMGq1V
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabaseに書き込んで一時停止を防ぐ
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # ① 主手段：keepalive テーブルへ upsert（書き込み＝確実にDB活動として計上される）
          WCODE=$(curl -s -o /tmp/keepalive_write.txt -w '%{http_code}' \
            -X POST "$SB_URL/rest/v1/keepalive?on_conflict=id" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\":1,\"last_ping\":\"$NOW\",\"source\":\"github-actions\"}")
          echo "write ping HTTP $WCODE"

          if [ "$WCODE" -ge 200 ] && [ "$WCODE" -lt 300 ]; then
            echo "書き込みpingに成功しました（$NOW）。"
            exit 0
          fi

          echo "::warning::書き込みpingに失敗（HTTP $WCODE）。keepaliveテーブル未作成、またはRLSポリシー未設定の可能性があります。"
          cat /tmp/keepalive_write.txt || true

          # ② フォールバック：従来どおりの読み取りping（最低限プロジェクトには触る）
          RCODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SB_URL/rest/v1/curb65_records?select=id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "read ping HTTP $RCODE"

          if [ "$RCODE" -ge 200 ] && [ "$RCODE" -lt 300 ]; then
            echo "読み取りpingは成功しました。keepaliveテーブルを作れば自動で書き込み型に切り替わります。"
            exit 0
          fi

          echo "::error::読み取りpingも失敗しました（HTTP $RCODE）。Supabaseプロジェクトの状態を確認してください。"
          exit 1
      - uses: actions/checkout@v4
      - name: リポジトリの休眠を防ぐ（前回コミットから50日超なら空コミット）
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "最終コミットから ${days} 日"
          if [ "$days" -ge 50 ]; then
            git config user.name "keepalive-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 定期実行の休止防止（自動）"
            git push
          fi
